{% extends "base.html" %}

{% block content %}

<form method='post' action="/">
    {% csrf_token %}
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Name</label>
      <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="userName">
    </div>
    <div class="mb-3">
        <label for="exampleInputName" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="exampleInputName" aria-describedby="emailHelp" name="userEmail">
    </div>
    <div>
      <select class="form-select form-select-lg mb-3" aria-label="Large select example" name = "rating">
        <option selected>Open this select menu</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </div>
    
   <button type="submit" class="btn btn-primary">Submit</button>
  </form>

{% endblock %}
